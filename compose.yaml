services:
  imapfilter:
    build: .
    image: inbox-studio:local
    restart: unless-stopped
    init: true
    environment:
      IMAP_USERNAME: ${IMAP_USERNAME:?Set your iCloud Mail username in .env}
      IMAP_PASSWORD: ${IMAP_PASSWORD:?Set your Apple app-specific password in .env}
    depends_on:
      - web
    volumes:
      - rules-data:/data
    read_only: true
    tmpfs:
      - /tmp
      - /home/filter/.imapfilter:uid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  web:
    image: inbox-studio:local
    build: .
    entrypoint: ["python3", "/app/server.py"]
    restart: unless-stopped
    init: true
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.inboxstudio.rule=Host(`${INBOXSTUDIO_HOST:?Set your Inbox Studio hostname in .env}`)"
      - "traefik.http.routers.inboxstudio.entrypoints=websecure"
      - "traefik.http.routers.inboxstudio.tls=true"
      - "traefik.http.routers.inboxstudio.tls.certresolver=cloudflare"
      - "traefik.http.routers.inboxstudio.middlewares=tinyauth@docker"
      - "traefik.http.routers.inboxstudio.service=inboxstudio"
      - "traefik.http.services.inboxstudio.loadbalancer.server.port=8080"
    environment:
      DRY_RUN: ${DRY_RUN:-true}
      INTERVAL_SECONDS: ${INTERVAL_SECONDS:-300}
    volumes:
      - rules-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  rules-data:
networks:
  proxy:
    external: true
